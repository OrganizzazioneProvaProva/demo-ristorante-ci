name: Build demo ristorante

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Request an approved deployment of this build
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-demo-ristorante
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium for the browser tests
        run: pnpm --filter @siti/core exec playwright-core install --with-deps chromium

      - name: Typecheck the demo
        run: pnpm --filter demo-ristorante typecheck

      - name: Build from Sanity and check the site
        env:
          SITI_CONTENT: sanity
          SANITY_PROJECT_ID: l89w9ai1
          SANITY_DATASET: production
        run: pnpm --filter demo-ristorante test

      - name: Upload the verified dist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: demo-ristorante-dist
          path: clienti/demo-ristorante/dist/
          if-no-files-found: error

  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main' && github.repository == 'OrganizzazioneProvaProva/demo-ristorante-ci'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: demo-ristorante-deploy
    permissions:
      contents: read
    steps:
      - name: Check out the deployment files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/deploy-demo
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: .github/deploy-demo/package.json
          run_install: false

      - name: Install pinned Wrangler
        run: |
          install_dir="$RUNNER_TEMP/demo-wrangler"
          mkdir -p "$install_dir"
          cp .github/deploy-demo/{package.json,pnpm-lock.yaml,pnpm-workspace.yaml} "$install_dir"
          pnpm --dir "$install_dir" install --frozen-lockfile --ignore-scripts

      - name: Download the verified dist from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: demo-ristorante-dist
          path: ${{ runner.temp }}/demo-ristorante-dist

      - name: Deploy and verify the demo
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bash .github/deploy-demo/deploy.sh \
            "$RUNNER_TEMP/demo-wrangler/node_modules/.bin/wrangler" \
            "$RUNNER_TEMP/demo-ristorante-dist"
