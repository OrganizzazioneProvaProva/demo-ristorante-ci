name: Check editorial menu gate selection

on:
  push:
    branches:
      - ci/collaudo-selezione-gate-menu

permissions:
  contents: read

jobs:
  verify-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the test branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Test quick gate selection and full-suite fallbacks
        run: node --test .github/menu-gate/select-mode.test.mjs
